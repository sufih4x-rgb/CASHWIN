<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Flow Verification</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 40px; 
            background: #f4f4f4; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            display: inline-block; 
            border-radius: 8px; 
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 400px; 
        }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 14px; 
        }
        button { 
            padding: 12px 25px; 
            width: 95%; 
            font-size: 18px; 
            cursor: pointer; 
            background: #ffc107; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            margin-top: 15px; 
            color: #000;
        }
        #codeDisplay { 
            margin-top: 20px; 
            font-size: 24px; 
            font-weight: bold; 
            color: #333; 
        }
        #statusMessage { 
            margin-top: 15px; 
            font-size: 16px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tournament Connect</h2>
        <p>Enter your API details to verify</p>
        
        <!-- Input Fields -->
        <input type="text" id="uid" placeholder="Enter Your UID">
        <input type="text" id="apiKey" placeholder="Enter API Key">
        <input type="text" id="apiUrl" placeholder="Enter API URL (e.g. https://.../fampay.php)">
        
        <!-- Action Button -->
        <button id="sendBtn">Send</button>
        
        <!-- Messages -->
        <div id="codeDisplay"></div>
        <div id="statusMessage"></div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            const uid = document.getElementById('uid').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();

            // Check if fields are empty
            if (!uid || !apiKey || !apiUrl) {
                document.getElementById('statusMessage').innerText = "Please fill all fields!";
                document.getElementById('statusMessage').style.color = "red";
                return;
            }

            // Generate 6-digit code
            let generatedCode = Math.floor(100000 + Math.random() * 900000);
            
            document.getElementById('codeDisplay').innerText = "Generated Code: " + generatedCode;
            document.getElementById('statusMessage').innerText = "Checking email... Please wait...";
            document.getElementById('statusMessage').style.color = "blue";

            // Prepare data to send
            const formData = new URLSearchParams();
            formData.append('uid', uid);
            formData.append('api_key', apiKey);
            formData.append('code', generatedCode);

            // Send POST request to the API URL provided by user
            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP Status " + response.status);
                }
                return response.json();
            })
            .then(data => {
                // Success Handling
                if(data.status === 'success') {
                    document.getElementById('statusMessage').innerText = "Successful connect";
                    document.getElementById('statusMessage').style.color = "green";
                } else {
                    document.getElementById('statusMessage').innerText = "Failed: " + (data.message || "Email not found.");
                    document.getElementById('statusMessage').style.color = "red";
                }
            })
            .catch(error => {
                // Error Handling
                console.error('Fetch Error:', error);
                document.getElementById('statusMessage').innerText = "Server connection error (CORS or Invalid URL).";
                document.getElementById('statusMessage').style.color = "red";
            });
        });
    </script>

</body>
</html>
